# Netlify configuration for the MHS Quote Builder.
# This is a single static HTML app (no build step).
#
# Recommended setup for "live for the team" + "keep working in the background":
#   1. Connect this repo to a Netlify site.
#   2. Production branch  = main   -> your live URL  (e.g. mhs-quote.netlify.app)
#   3. Enable Branch deploys for "dev" (Site settings > Build & deploy > Branches)
#      -> automatically gives you  dev--mhs-quote.netlify.app
#   The app auto-detects which one it is and sandboxes dev's saved data.

[build]
  publish = "."

# Always serve the app for any path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Make sure the team always loads the latest released HTML.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
